[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "literature-rag"
version = "0.1.0"
description = "Auditable offline retrieval of OpenReview abstracts and reviews"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
literature-rag = "literature_rag.cli:main"

[tool.setuptools.packages.find]
include = ["literature_rag*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
